# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${USER_SERVICE_PORT}

# ============================================================================
# SPRING CORE CONFIGURATION
# ============================================================================
spring:
  # Prevent Spring Boot from printing its ASCII banner on startup for cleaner logs
  main:
    banner-mode: off

  application:
    name: user-service

  # Loads environment variables directly from .env files
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:user-service/.env[.properties]

  # Error Handling: Ensures detailed messages are returned in API responses,
  # but stack traces are never exposed to clients (Security Best Practice)
  web:
    error:
      include-message: always
      include-stacktrace: never

  # ============================================================================
  # DATABASE CONFIGURATION (PostgreSQL + HikariCP)
  # ============================================================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ============================================================================
  # JPA & HIBERNATE
  # ============================================================================
  jpa:
    # Disable OSIV to avoid performance bottlenecks and N+1 query issues
    open-in-view: false
    # Disable printing SQL to the console to maintain clean startup and runtime logs
    show-sql: false

    hibernate:
      # Rely entirely on Flyway for schema creation; never let Hibernate auto-create tables
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # ============================================================================
  # DATABASE MIGRATIONS (Flyway)
  # ============================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Prevent accidental destruction of the database by ensuring clean is disabled
    clean-disabled: true

  # ============================================================================
  # EMAIL CONFIGURATION (JavaMailSender)
  # ============================================================================
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_MAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ============================================================================
  # FILE UPLOADS
  # ============================================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ============================================================================
  # SECURITY
  # ============================================================================
  # By explicitly declaring a dummy username/password, we stop Spring Security
  # from generating and logging a random password on every startup.
  security:
    user:
      name: internal
      password: disabled-default-password

# ============================================================================
# SPHERE APPLICATION SPECIFICS
# ============================================================================
sphere:
  jwt:
    # Used for signing and verifying stateless user authentication tokens
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRE_SECONDS}
  internal:
    # Secret key used strictly for backend service-to-service communication
    api-key: ${INTERNAL_API_SECRET:default-secret}
  client-url: ${CLIENT_URL}
  mail:
    from: ${FROM_EMAIL}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

# ============================================================================
# SERVICE DISCOVERY (EUREKA CLIENT)
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        # Expose only health and info endpoints for internal monitoring
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================================================================
# OPENAPI / SWAGGER DOCUMENTATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  # Highly readable, colorful console pattern for developer experience
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n"

  level:
    root: INFO

    # Suppress verbose framework logs to keep the console clean
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.boot: WARN
    
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    
    com.zaxxer.hikari: WARN
    
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    
    org.springdoc: ERROR

    # Enable detailed logging only for our own application code
    com.sphere: DEBUG
