# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${AI_SERVICE_PORT:8084}

# ============================================================================
# SPRING CORE CONFIGURATION
# ============================================================================
spring:
  main:
    banner-mode: off

  application:
    name: ai-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:ai-service/.env[.properties]

  web:
    error:
      include-message: always
      include-stacktrace: never

  # ============================================================================
  # DATABASE CONFIGURATION
  # ============================================================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ============================================================================
  # JPA & HIBERNATE
  # ============================================================================
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # ============================================================================
  # DATABASE MIGRATIONS (Flyway)
  # ============================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

  # ============================================================================
  # SPRING AI (OpenAI Integration)
  # ============================================================================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://openai.generative-eu.engine.capgemini.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o}
        max-tokens: ${OPENAI_MAX_TOKENS:1024}
        temperature: ${OPENAI_TEMPERATURE:0.3}

  # ============================================================================
  # FILE UPLOADS
  # ============================================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  # ============================================================================
  # SECURITY
  # ============================================================================
  security:
    user:
      name: internal
      password: disabled-default-password

# ============================================================================
# SPHERE APPLICATION SPECIFICS
# ============================================================================
sphere:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    api-key: ${INTERNAL_API_SECRET}

# ============================================================================
# SERVICE DISCOVERY (EUREKA CLIENT)
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# FEIGN CLIENT CONFIGURATION
# ============================================================================
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      POST-SERVICE:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      POST-SERVICE:
        timeout-duration: 4s

# ============================================================================
# ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================================================================
# OPENAPI / SWAGGER DOCUMENTATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.boot: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.sphere.ai: INFO
    org.springframework.ai: INFO
