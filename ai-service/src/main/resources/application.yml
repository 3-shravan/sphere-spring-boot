# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${AI_SERVICE_PORT:8084}
  servlet:
    context-path: /

# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================
spring:
  # Disable Spring Boot banner for cleaner logs
  main:
    banner-mode: off

  # Enable ANSI colored output for console logs
  output:
    ansi:
      enabled: always

  # Application identification
  application:
    name: ai-service

  # Environment-specific profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Environment file imports
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:ai-service/.env[.properties]

  # API error response configuration
  web:
    error:
      include-message: always
      include-stacktrace: never # NEVER expose stack traces (security best practice)

  # Database configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # JPA/Hibernate configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema — never let Hibernate auto-create
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # Flyway database migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true # NEVER enable clean in production

  # Spring AI — Capgemini OpenAI gateway
  ai:
    openai:
      api-key: ${OPENAI_API_KEY} # Required: set to the Capgemini API key
      base-url: ${OPENAI_BASE_URL:https://openai.generative-eu.engine.capgemini.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o}
        max-tokens: ${OPENAI_MAX_TOKENS:1024}
        temperature: ${OPENAI_TEMPERATURE:0.3}

  # File upload — allow larger images for caption generation
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Cloud integrations
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

# ============================================================================
# SPHERE-SPECIFIC CONFIGURATION
# ============================================================================
sphere:
  jwt:
    secret: ${JWT_SECRET} # MUST match user-service's JWT_SECRET
  internal:
    api-key: ${INTERNAL_API_SECRET} # MUST match other services' INTERNAL_API_SECRET

# ============================================================================
# SERVICE DISCOVERY (EUREKA)
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# FEIGN CLIENT CONFIGURATION
# ============================================================================
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      POST-SERVICE:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      POST-SERVICE:
        timeout-duration: 4s

# ============================================================================
# MANAGEMENT & ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ============================================================================
# SPRINGDOC/OPENAPI CONFIGURATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.boot: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.sphere.ai: INFO
    org.springframework.ai: INFO
