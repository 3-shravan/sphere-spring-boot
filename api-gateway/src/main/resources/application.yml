# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${GATEWAY_PORT}
  servlet:
    context-path: /

# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================
spring:
  # Disable Spring Boot banner for cleaner logs
  main:
    banner-mode: off
  # Enable ANSI colored output for console logs
  output:
    ansi:
      enabled: always
  # Application identification
  application:
    name: api-gateway
  # Environment-specific profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Environment file imports
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:api-gateway/.env[.properties]
  # API error response configuration
  web:
    error:
      include-message: always # Always include error message in response
      include-stacktrace: never # NEVER expose stack traces (security best practice)
  # Spring Cloud Gateway routing configuration
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: post-service-posts
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: post-service-docs
          uri: lb://post-service
          predicates:
            - Path=/post-service/v3/api-docs
          filters:
            - RewritePath=/post-service/v3/api-docs, /v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs, /v3/api-docs

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

        - id: ai-service-docs
          uri: lb://ai-service
          predicates:
            - Path=/ai-service/v3/api-docs
          filters:
            - RewritePath=/ai-service/v3/api-docs, /v3/api-docs

# ============================================================================
# SPHERE-SPECIFIC CONFIGURATION
# ============================================================================
sphere:
  cors:
    client-url: ${CLIENT_URL}
    production-client-url: ${PRODUCTION_CLIENT_URL:}

# ============================================================================
# SERVICE DISCOVERY (EUREKA)
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# MANAGEMENT & ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway # Include gateway-specific endpoint
  endpoint:
    health:
      show-details: when-authorized # Show details only for authorized users
      probes:
        enabled: true # Enable liveness and readiness probes (Kubernetes)

# ============================================================================
# SPRINGDOC/OPENAPI CONFIGURATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true # Enable API documentation endpoint
    path: /v3/api-docs
  swagger-ui:
    enabled: true # Enable Swagger UI
    path: /swagger-ui.html # Configurable Swagger UI path
    operations-sorter: method # Sort operations by HTTP method
    tags-sorter: alpha # Sort tags alphabetically
    use-root-path: false # Use full path, not root
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Post Service
        url: /post-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  # Logging pattern: concise, colorful, developer-friendly
  # Format: [TIME] [LEVEL] [LOGGER] - MESSAGE
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n"

  # Logging levels configuration
  level:
    # Root logger level
    root: INFO
    # Spring Framework logging (WARN to reduce noise)
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.boot: WARN
    # Hibernate/JPA logging (WARN to reduce noise)
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    # Tomcat container logging (WARN to reduce noise)
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    # Database connection pool logging
    com.zaxxer.hikari: WARN
    # Netflix/Eureka service discovery logging
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    # SpringDoc/OpenAPI logging (ERROR to suppress startup warnings)
    org.springdoc: ERROR
    # Application-specific logging (DEBUG for development)
    com.sphere: DEBUG
