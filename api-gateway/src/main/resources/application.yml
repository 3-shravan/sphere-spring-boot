# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${GATEWAY_PORT}

# ============================================================================
# SPRING CORE CONFIGURATION
# ============================================================================
spring:
  main:
    banner-mode: off

  application:
    name: api-gateway

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:api-gateway/.env[.properties]

  # ============================================================================
  # SERVICE DISCOVERY (EUREKA CLIENT)
  # ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized

# ============================================================================
# OPENAPI / SWAGGER DOCUMENTATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Post Service
        url: /post-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
      - name: AI Service
        url: /ai-service/v3/api-docs

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.cloud.gateway: WARN
    com.netflix.eureka: WARN
    org.springdoc: ERROR
    com.sphere: DEBUG
