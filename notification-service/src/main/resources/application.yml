server:
  port: ${NOTIFICATION_SERVICE_PORT}

spring:
  application:
    name: NOTIFICATION-SERVICE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:notification-service/.env[.properties]

sphere:
  jwt:
    secret: ${JWT_SECRET} # MUST match user-service/post-service's JWT_SECRET — same shared stateless-JWT signing key
  internal:
    api-key: ${INTERNAL_API_SECRET} # MUST match user-service/post-service's INTERNAL_API_SECRET

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sphere.notification: INFO
