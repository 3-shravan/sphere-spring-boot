# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: ${NOTIFICATION_SERVICE_PORT}

# ============================================================================
# SPRING CORE CONFIGURATION
# ============================================================================
spring:
  main:
    banner-mode: off

  application:
    name: notification-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:notification-service/.env[.properties]

  web:
    error:
      include-message: always
      include-stacktrace: never

# ============================================================================
# SPHERE APPLICATION SPECIFICS
# ============================================================================
sphere:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    api-key: ${INTERNAL_API_SECRET}

# ============================================================================
# SERVICE DISCOVERY (EUREKA CLIENT)
# ============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ============================================================================
# ACTUATOR ENDPOINTS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ============================================================================
# OPENAPI / SWAGGER DOCUMENTATION
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  pattern:
    console: "%clr(%d{HH:mm}){magenta} %highlight(%-5level) %clr(%logger{30}){green} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.cloud: WARN
    org.springframework.boot: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    org.springdoc: ERROR
    com.sphere: DEBUG
